<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sekuya&display=swap');

    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
    body {
      color: white;
      display: flex;
      padding: 20px;
      background-color: black;
    }


    main {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: 100%;
    }

    h2{
      background-color: black;
      color: white;
    }

    @media (max-width: 1000px) {
      #main {
        flex-direction: column;
        gap: 20px;
      }

      
    }
  </style>

</head>
<body>
 
  <main >
    <div><h2>Cookie Clicker</h2></div>
    <div id="cookie-container">
      <img src="https://www.crackingmedia.com/images/stories/half-eaten-cookie-200px.png" alt="Cookie" id="cookie">
      <p>Cookies: <span id="cookie-count">0</span></p>  
    </div>
    <button id="cookie-button">Click Me!</button>
    
  </main>
    
</body>
</html>
